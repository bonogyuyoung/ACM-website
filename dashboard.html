<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Dashboard | Medical STEM Education</title>
  <meta name="description" content="Your learning history — watched videos, read articles, and solved questions, computed locally.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Medical STEM Education">
  <meta property="og:title" content="Learning Dashboard | Medical STEM Education">
  <meta property="og:description" content="Your learning history — watched videos, read articles, and solved questions, computed locally.">
  <meta property="og:url" content="https://bonogyuyoung.github.io/ACM-website/dashboard.html">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="header-container"></div>

  <main>
    <section>
      <h2>Learning Dashboard</h2>
      <p>Videos watched, articles read, and practice questions solved — kept only in this browser.</p>

      <div class="card">
        <h3>Backup &amp; Restore</h3>
        <p>Export your saved items, watch history, and read articles as a JSON file, or import a file you exported on another device. No account needed.</p>
        <button type="button" class="btn btn-active" id="export-data-btn">Export My Data</button>
        <label class="btn btn-active" for="import-data-input">Import My Data
          <input type="file" id="import-data-input" accept="application/json" hidden>
        </label>
        <p class="card-meta" id="data-transfer-status"></p>
      </div>

      <div id="dashboard-container" class="grid-container"></div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
